<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · CampusLoop AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #17233c;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(100%, 560px);
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 30px #17233c14;
      text-align: center;
    }
    .panel h1 { margin-top: 0; }
    .panel p { color: #65718a; line-height: 1.6; }
    .button {
      display: inline-block;
      padding: 13px;
      border-radius: 9px;
      background: #087f68;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover { background: #066b58; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Checkout</h1>
    <p>Payment integration is coming soon. No payment details are collected on this page.</p>
    <a class="button" href="/cart.html">← Back to Cart</a>
  </main>
</body>
</html>

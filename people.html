<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Directory · CampusLoop AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #17233c; }
    header { background: #122344; color: white; padding: 22px 7%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    header h1 { margin: 0; font-size: 25px; }
    header span { color: #72e2c0; }
    main { padding: 32px 7%; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .toolbar h2 { margin: 0; }
    .button { display: inline-block; padding: 13px; border-radius: 9px; background: #087f68; color: white; font-weight: bold; text-decoration: none; }
    .button:hover { background: #066b58; }
    .directory-search { display: flex; gap: 10px; margin-bottom: 20px; }
    .directory-search input { flex: 1; min-width: 0; padding: 13px; border: 1px solid #d6ddeb; border-radius: 9px; font-size: 15px; }
    .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .group { padding: 20px; border: 1px solid #dce5f1; border-radius: 15px; background: white; box-shadow: 0 4px 16px #17233c0a; }
    .group h3 { margin-top: 0; color: #087f68; }
    .group ul { margin: 0; padding-left: 20px; line-height: 1.8; }
    .message { color: #65718a; }
    .error { color: #c0392b; }
    :root { --navy: #10234e; --blue: #294b87; --ink: #14213d; --muted: #64748b; --line: #dce4f2; --canvas: #fff; }
    body { background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 3; padding: 14px 6%; background: var(--navy); border-bottom: 1px solid #ffffff1f; }
    header h1 { font-size: 22px; letter-spacing: -.8px; }
    header > div { margin-right: auto; color: #b8cec5; font-size: 13px; }
    header nav { display: flex; gap: 6px; flex-wrap: wrap; }
    header nav a { padding: 9px 12px; border-radius: 8px; color: #e3f0ea; font-size: 13px; font-weight: 700; text-decoration: none; }
    header nav a:hover { background: #ffffff1a; }
    main { max-width: 1180px; margin: auto; padding: 42px 6%; }
    .toolbar { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .toolbar h2 { color: var(--ink); letter-spacing: -.6px; }
    .button { background: var(--navy); }
    .button:hover { background: var(--blue); }
    .directory-search input { background: white; border-color: var(--line); }
    .group { border-color: var(--line); border-radius: 12px; box-shadow: 0 7px 22px #10234e0b; }
    .group h3 { color: var(--blue); }
    .message { color: var(--muted); }
    @media (max-width: 700px) { header > div { display: none; } header nav { width: 100%; } main { padding-top: 28px; } }
  </style>
</head>
<body>
  <header>
    <h1>Campus<span>Loop</span> AI</h1>
    <div>Student Marketplace · Buy Smart, Reuse More</div>
    <nav aria-label="Main navigation">
      <a href="/products.html">Marketplace</a>
      <a href="/events.html">Events</a>
      <a href="/people.html">Campus Directory</a>
      <a href="/cart.html">🛒 Cart <span id="cartCount">0</span></a>
      <a href="/index.html#account">Account</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <h2>Campus directory</h2>
      <a class="button" href="/index.html">← Back to Home</a>
    </div>
    <div class="directory-search">
      <input id="directorySearch" type="search" placeholder="Search students or colleges..." aria-label="Search directory">
    </div>
    <p id="message" class="message" role="status" aria-live="polite">Loading college groups...</p>
    <section id="groups" class="groups"></section>
  </main>
  <script>
    let groups = [];

    function renderGroups(query = "") {
      const message = document.getElementById("message");
      const container = document.getElementById("groups");
      const normalizedQuery = query.trim().toLowerCase();
      const filteredGroups = groups
        .map(group => ({
          ...group,
          students: (group.students || []).filter(student =>
            !normalizedQuery || group.college.toLowerCase().includes(normalizedQuery) ||
            (student.name || "").toLowerCase().includes(normalizedQuery)
          )
        }))
        .filter(group => group.students.length > 0);

      container.replaceChildren();
      if (filteredGroups.length === 0) {
        message.textContent = normalizedQuery
          ? "No campus members match your search."
          : "No college groups are available yet.";
        return;
      }
      message.textContent = "";
      for (const groupData of filteredGroups) {
        const group = document.createElement("article");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = `${groupData.college} (${groupData.students.length})`;
        const list = document.createElement("ul");
        for (const person of groupData.students) {
          const item = document.createElement("li");
          item.textContent = person.name || "Campus member";
          list.appendChild(item);
        }
        group.append(heading, list);
        container.appendChild(group);
      }
    }

    async function loadGroups() {
      const message = document.getElementById("message");
      try {
        const response = await fetch("/api/people/grouped", { credentials: "same-origin" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Could not load the directory.");
        groups = Array.isArray(data.groups) ? data.groups : [];
        renderGroups(document.getElementById("directorySearch").value);
      } catch (error) {
        console.error("Directory loading error:", error);
        message.className = "error";
        message.textContent = error.message || "Unable to load the directory.";
      }
    }
    document.getElementById("directorySearch").addEventListener("input", event => {
      renderGroups(event.target.value);
    });
    loadGroups();
    try {
      const cart = JSON.parse(localStorage.getItem("campusloop.cart") || "[]");
      document.getElementById("cartCount").textContent = Array.isArray(cart)
        ? cart.reduce((total, item) => total + (Number.isInteger(item.quantity) ? item.quantity : 0), 0)
        : 0;
    } catch {}
  </script>
</body>
</html>

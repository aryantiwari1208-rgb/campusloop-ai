<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events · CampusLoop AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #17233c;
    }
    header {
      background: #122344;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    header h1 { margin: 0; font-size: 25px; }
    header span { color: #72e2c0; }
    main { padding: 32px 7%; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .toolbar h2 { margin: 0; }
    .button, button {
      display: inline-block;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #087f68;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover, button:hover { background: #066b58; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .event-card {
      background: white;
      border: 1px solid #dce5f1;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 16px #17233c0a;
    }
    .event-card h3 { margin: 12px 0 14px; }
    .event-meta {
      display: grid;
      gap: 8px;
      color: #65718a;
      font-size: 14px;
      line-height: 1.45;
    }
    .event-description {
      margin: 16px 0 0;
      color: #65718a;
      line-height: 1.6;
    }
    .tag {
      display: inline-block;
      background: #e1f7ef;
      color: #087f68;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }
    .loading { color: #65718a; }
    .success { color: #087f68; }
    .error { color: #c0392b; }
    footer {
      text-align: center;
      color: #65718a;
      padding: 25px;
    }
    :root { --navy: #10234e; --blue: #294b87; --ink: #14213d; --muted: #64748b; --line: #dce4f2; --canvas: #fff; }
    body { background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 3; padding: 14px 6%; background: var(--navy); border-bottom: 1px solid #ffffff1f; }
    header h1 { font-size: 22px; letter-spacing: -.8px; }
    header > div { margin-right: auto; color: #b8cec5; font-size: 13px; }
    header nav { display: flex; gap: 6px; flex-wrap: wrap; }
    header nav a { padding: 9px 12px; border-radius: 8px; color: #e3f0ea; font-size: 13px; font-weight: 700; text-decoration: none; }
    header nav a:hover { background: #ffffff1a; }
    main { max-width: 1180px; margin: auto; padding: 42px 6%; }
    .toolbar { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .toolbar h2 { color: var(--ink); letter-spacing: -.6px; }
    .button, button { background: var(--navy); }
    .button:hover, button:hover { background: var(--blue); }
    .event-card { border-color: var(--line); border-radius: 12px; box-shadow: 0 7px 22px #10234e0b; transition: transform 160ms ease, box-shadow 160ms ease; }
    .event-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px #10234e14; }
    .tag { background: #ddf3e5; color: #23613e; }
    .event-meta, .event-description { color: var(--muted); }
    @media (max-width: 700px) { header > div { display: none; } header nav { width: 100%; } main { padding-top: 28px; } }
    .mobile-menu-toggle { display: none; }
    @media (max-width: 700px) {
      .mobile-menu-toggle { display: inline-flex; background: transparent; border: 1px solid #ffffff55; }
      header { align-items: center; }
      header nav { display: none; }
      header nav[data-mobile-open="true"] { display: flex; flex-direction: column; align-items: stretch; width: 100%; }
      header nav[data-mobile-open="true"] a { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Campus<span>Loop</span> AI</h1>
    <div>Student Marketplace · Buy Smart, Reuse More</div>
    <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mainNavigation" aria-label="Open navigation menu">☰</button>
    <nav id="mainNavigation" data-mobile-open="false" aria-label="Main navigation">
      <a href="/products.html">Marketplace</a>
      <a href="/events.html">Events</a>
      <a href="/people.html">Campus Directory</a>
      <a href="/cart.html">🛒 Cart <span id="cartCount">0</span></a>
      <a href="/index.html#account">Account</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <h2>Campus events</h2>
      <a class="button" href="/index.html">← Back to Home</a>
    </div>
    <p id="eventMessage" role="status" aria-live="polite"></p>
    <div class="grid" id="eventsList" aria-live="polite"></div>
  </main>

  <footer>CampusLoop AI · A smarter, more sustainable campus</footer>

  <script>
    const container = document.getElementById("eventsList");
    const eventMessage = document.getElementById("eventMessage");

    function formatEventDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "Date to be announced";
      return date.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function displayEvents(events) {
      container.replaceChildren();
      if (!events || events.length === 0) {
        const message = document.createElement("p");
        message.className = "loading";
        message.textContent = "No campus events are available right now.";
        container.appendChild(message);
        return;
      }

      events.forEach(event => {
        const card = document.createElement("article");
        card.className = "event-card";

        const category = document.createElement("span");
        category.className = "tag";
        category.textContent = event.category || "Campus event";

        const title = document.createElement("h3");
        title.textContent = event.title || "Untitled event";

        const meta = document.createElement("div");
        meta.className = "event-meta";
        meta.textContent = `📅 ${formatEventDate(event.date)}\n📍 ${event.location || "Location to be announced"}`;
        meta.style.whiteSpace = "pre-line";
        card.append(category, title, meta);

        if (event.description) {
          const description = document.createElement("p");
          description.className = "event-description";
          description.textContent = event.description;
          card.appendChild(description);
        }
        container.appendChild(card);
      });
    }

    async function loadEvents() {
      container.replaceChildren();
      eventMessage.className = "loading";
      eventMessage.textContent = "Loading campus events...";
      try {
        const response = await fetch("/api/events");
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Could not load events.");
        displayEvents(data.events || []);
        eventMessage.textContent = new URLSearchParams(window.location.search).has("created")
          ? "Event created successfully."
          : "";
        eventMessage.className = "success";
      } catch (error) {
        console.error("Event loading error:", error);
        eventMessage.className = "error";
        eventMessage.textContent = error.message || "Unable to load events. Please try again.";
      }
    }

    loadEvents();
    try {
      const cart = JSON.parse(localStorage.getItem("campusloop.cart") || "[]");
      document.getElementById("cartCount").textContent = Array.isArray(cart)
        ? cart.reduce((total, item) => total + (Number.isInteger(item.quantity) ? item.quantity : 0), 0)
        : 0;
    } catch {}
    const mobileMenuToggle = document.getElementById("mobileMenuToggle");
    const mainNavigation = document.getElementById("mainNavigation");
    mobileMenuToggle.addEventListener("click", () => {
      const isOpen = mainNavigation.dataset.mobileOpen === "true";
      mainNavigation.dataset.mobileOpen = String(!isOpen);
      mobileMenuToggle.setAttribute("aria-expanded", String(!isOpen));
      mobileMenuToggle.setAttribute("aria-label", isOpen ? "Open navigation menu" : "Close navigation menu");
      mobileMenuToggle.textContent = isOpen ? "☰" : "✕";
    });
    mainNavigation.addEventListener("click", event => {
      if (event.target.closest("a")) {
        mainNavigation.dataset.mobileOpen = "false";
        mobileMenuToggle.setAttribute("aria-expanded", "false");
        mobileMenuToggle.setAttribute("aria-label", "Open navigation menu");
        mobileMenuToggle.textContent = "☰";
      }
    });
  </script>
</body>
</html>

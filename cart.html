<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart · CampusLoop AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #17233c;
    }
    header {
      background: #122344;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    header h1 { margin: 0; font-size: 25px; }
    header span { color: #72e2c0; }
    main { padding: 32px 7%; }
    .toolbar, .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .toolbar { margin-bottom: 20px; }
    .toolbar h2 { margin: 0; }
    .button, button {
      display: inline-block;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #087f68;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover, button:hover { background: #066b58; }
    .button.secondary { background: #e9eef6; color: #17233c; }
    .button.danger { background: #b42318; }
    .button.danger:hover { background: #941b13; }
    .cart-list { display: grid; gap: 14px; }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 18px;
      padding: 18px;
      background: white;
      border: 1px solid #dce5f1;
      border-radius: 15px;
      box-shadow: 0 4px 16px #17233c0a;
    }
    .cart-item h3 { margin: 0 0 7px; }
    .cart-item p { margin: 0; color: #65718a; }
    .quantity { display: flex; align-items: center; gap: 8px; }
    .quantity button { padding: 7px 11px; }
    .subtotal { min-width: 100px; text-align: right; font-weight: bold; }
    .remove { background: #b42318; padding: 8px 10px; }
    .total {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      text-align: right;
      font-size: 21px;
      font-weight: bold;
    }
    .message { color: #65718a; }
    .error { color: #c0392b; }
    .empty { color: #65718a; }
    @media (max-width: 600px) {
      .cart-item { grid-template-columns: 1fr; gap: 12px; }
      .subtotal { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Campus<span>Loop</span> AI</h1>
    <div>Student Marketplace · Buy Smart, Reuse More</div>
  </header>
  <main>
    <div class="toolbar">
      <h2>Shopping cart</h2>
      <a class="button secondary" href="/index.html">Continue Shopping</a>
    </div>
    <p id="cartMessage" class="message" role="status" aria-live="polite">Loading your cart...</p>
    <div id="cartList" class="cart-list"></div>
    <div id="cartSummary" hidden>
      <div id="cartTotal" class="total"></div>
      <div class="actions">
        <button id="clearCartButton" class="button danger" type="button">Clear Cart</button>
        <a class="button secondary" href="/index.html">Continue Shopping</a>
        <a class="button" href="/checkout.html">Proceed to Checkout</a>
      </div>
    </div>
  </main>
  <script>
    const cartStorageKey = "campusloop.cart";
    const cartList = document.getElementById("cartList");
    const cartMessage = document.getElementById("cartMessage");
    const cartSummary = document.getElementById("cartSummary");

    function readCart() {
      try {
        const stored = JSON.parse(localStorage.getItem(cartStorageKey) || "[]");
        if (!Array.isArray(stored)) throw new Error("Invalid cart format");
        const validItems = [];
        for (const item of stored) {
          if (!item || !Number.isSafeInteger(item.id) || item.id < 1 ||
              !Number.isSafeInteger(item.quantity) || item.quantity < 1 ||
              item.quantity > 99) continue;
          const existing = validItems.find(cartItem => cartItem.id === item.id);
          if (existing) existing.quantity = Math.min(99, existing.quantity + item.quantity);
          else validItems.push({ id: item.id, quantity: item.quantity });
        }
        localStorage.setItem(cartStorageKey, JSON.stringify(validItems));
        return validItems;
      } catch {
        localStorage.removeItem(cartStorageKey);
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(cartStorageKey, JSON.stringify(cart));
    }

    function clearCart() {
      if (!window.confirm("Remove all items from your cart?")) return;
      localStorage.removeItem(cartStorageKey);
      loadCart();
    }

    function money(value) {
      return `₹${Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function renderCart(cart, products) {
      cartList.replaceChildren();
      const validProducts = cart
        .map(item => ({ item, product: products.find(product => product.id === item.id) }))
        .filter(entry => entry.product && Number.isFinite(Number(entry.product.price)) && Number(entry.product.price) >= 0);
      const validIds = new Set(validProducts.map(entry => entry.item.id));
      const cleanedCart = cart.filter(item => validIds.has(item.id));
      if (cleanedCart.length !== cart.length) saveCart(cleanedCart);

      if (validProducts.length === 0) {
        cartSummary.hidden = true;
        cartMessage.className = "empty";
        cartMessage.textContent = "Your cart is empty. Add a product to get started.";
        return;
      }

      cartMessage.textContent = "";
      cartMessage.className = "message";
      let total = 0;
      for (const { item, product } of validProducts) {
        const price = Number(product.price);
        const subtotal = price * item.quantity;
        total += subtotal;
        const row = document.createElement("article");
        row.className = "cart-item";
        const details = document.createElement("div");
        const name = document.createElement("h3");
        name.textContent = product.name || "Untitled product";
        const priceText = document.createElement("p");
        priceText.textContent = `${money(price)} each`;
        details.append(name, priceText);
        const controls = document.createElement("div");
        controls.className = "quantity";
        controls.innerHTML = `
          <button type="button" data-action="decrease" data-id="${item.id}" aria-label="Decrease quantity">−</button>
          <span>${item.quantity}</span>
          <button type="button" data-action="increase" data-id="${item.id}" aria-label="Increase quantity">+</button>
          <button type="button" class="remove" data-action="remove" data-id="${item.id}">Remove</button>
        `;
        const subtotalText = document.createElement("div");
        subtotalText.className = "subtotal";
        subtotalText.textContent = money(subtotal);
        row.append(details, controls, subtotalText);
        cartList.appendChild(row);
      }
      document.getElementById("cartTotal").textContent = `Total: ${money(total)}`;
      cartSummary.hidden = false;
    }

    async function loadCart() {
      try {
        const response = await fetch("/api/products");
        const data = await response.json();
        if (!response.ok || !Array.isArray(data.products)) {
          throw new Error(data.message || "Could not load products.");
        }
        renderCart(readCart(), data.products);
      } catch (error) {
        console.error("Cart loading error:", error);
        cartSummary.hidden = true;
        cartMessage.className = "error";
        cartMessage.textContent = "Unable to load your cart right now. Please try again.";
      }
    }

    cartList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const cart = readCart();
      const item = cart.find(cartItem => cartItem.id === id);
      if (!item) return;
      if (button.dataset.action === "increase") item.quantity = Math.min(99, item.quantity + 1);
      if (button.dataset.action === "decrease") item.quantity -= 1;
      if (button.dataset.action === "remove" || item.quantity < 1) {
        const index = cart.indexOf(item);
        cart.splice(index, 1);
      }
      saveCart(cart);
      loadCart();
    });

    document.getElementById("clearCartButton").addEventListener("click", clearCart);
    loadCart();
  </script>
</body>
</html>
